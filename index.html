<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stick Run</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Stick Run</h1>
    <div class="stage">
      <canvas id="game" width="900" height="320" aria-label="Stick figure endless runner"></canvas>
    </div>
    <p class="hint">
      <b>Space</b> / <b>&uarr;</b> / tap to jump &nbsp;&middot;&nbsp;
      <b>&darr;</b> to duck &nbsp;&middot;&nbsp;
      <b>P</b> pause &nbsp;&middot;&nbsp;
      <b>M</b> mute
    </p>
  </main>
  <script src="game.js"></script>
</body>
</html>
